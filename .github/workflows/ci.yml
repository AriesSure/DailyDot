name: CI

on:
  push:
    branches: [main, develop, 'chore/**', feature/agent-upgrade]
  pull_request:
    branches: [main, feature/agent-upgrade]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FLASK_ENV: testing
      TEST_DATABASE_PROFILE: sqlite-memory
      LLM_API_KEY: ""
      PEXELS_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Verify real Gunicorn loader (both WSGI aliases)
        run: python -m pytest -q tests/test_import_and_migration_safety.py::test_gunicorn_real_loader_aliases

      - name: Run complete SQLite suite
        run: |
          python -m pytest -q --cov=app --cov-report=term-missing

  mysql-integration:
    name: MySQL integration (same-repository events only)
    # Fork PRs and Dependabot-triggered events cannot use repository Actions Secrets.
    # Skip this job for those events; eligible events must fail on missing or invalid secrets.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FLASK_ENV: testing
      TEST_DATABASE_PROFILE: github-runner-mysql
      TEST_DATABASE_ALLOW_MYSQL: "1"
      LLM_API_KEY: ""
      PEXELS_API_KEY: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    services:
      mysql:
        # Same 8.0 major as docker-compose; pinned patch, no production change.
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DAILYDOT_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: dailydot_test
          MYSQL_USER: dailydot_test
          MYSQL_PASSWORD: ${{ secrets.DAILYDOT_TEST_DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=tcp --host=127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate required secret inputs without printing values
        env:
          ROOT_PASSWORD: ${{ secrets.DAILYDOT_MYSQL_ROOT_PASSWORD }}
          TEST_PASSWORD: ${{ secrets.DAILYDOT_TEST_DB_PASSWORD }}
        run: |
          python - <<'PY'
          import os, re
          root = os.environ.get('ROOT_PASSWORD', '')
          password = os.environ.get('TEST_PASSWORD', '')
          if not root or root == password or not re.fullmatch(r'[0-9a-fA-F]{32,128}', password):
              raise SystemExit('Required CI secrets missing or invalid; use distinct passwords and a 32-128 digit hex test password.')
          PY

      - name: Restrict the disposable service user to the literal test schema
        env:
          MYSQL_PWD: ${{ secrets.DAILYDOT_MYSQL_ROOT_PASSWORD }}
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
        run: |
          # Root is used only to initialize permissions inside this job's service.
          # Escape '_' so a database grant cannot match another schema name.
          docker exec -i -e MYSQL_PWD "$MYSQL_SERVICE_ID" mysql --protocol=socket -uroot <<'SQL'
          REVOKE ALL PRIVILEGES, GRANT OPTION FROM 'dailydot_test'@'%';
          GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, INDEX, ALTER, REFERENCES ON `dailydot\_test`.* TO 'dailydot_test'@'%';
          SQL

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Read-only profile, identity, grants and empty-schema preflight
        env:
          TEST_DATABASE_URL: mysql+pymysql://dailydot_test:${{ secrets.DAILYDOT_TEST_DB_PASSWORD }}@127.0.0.1:3306/dailydot_test
        run: python -m tests.mysql_ci

      - name: Run real MySQL lifecycle integration
        env:
          TEST_DATABASE_URL: mysql+pymysql://dailydot_test:${{ secrets.DAILYDOT_TEST_DB_PASSWORD }}@127.0.0.1:3306/dailydot_test
        run: python -m pytest -q -rA tests/test_mysql_ci_integration.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install flake8
      - run: flake8 app/ --max-line-length=120 --count
        continue-on-error: true
